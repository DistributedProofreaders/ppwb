[project]
name = "ppsmq"
version = "0.0"
requires-python = ">=3.8"

[tool.ruff]
target-version = "py38"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "D"]
ignore = [
    "E501", # }
    "D203", # } Conflicts with ruff format
    "D211", # }
    "D212", # }
    "UP009", # Allow explicit coding: utf8. utf8 isn't the default until Python 3.15
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.111",
]
